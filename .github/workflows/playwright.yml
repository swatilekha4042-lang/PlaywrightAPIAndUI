name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Verify Allure CLI
      run: npx allure --version

    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload Playwright failure evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Generate Allure Report
      id: generate_report
      if: always()
      run: npx allure generate allure-results --clean -o allure-report

    - name: Setup GitHub Pages
      if: always() && steps.generate_report.outcome == 'success'
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: always() && steps.generate_report.outcome == 'success'
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

  deploy:
    needs: test
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4